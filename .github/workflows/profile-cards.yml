name: Refresh profile cards

on:
  schedule:
    - cron: "17 * * * *"   # hourly
  workflow_dispatch:         # "Run workflow" button, and the ping from your other repos
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - "profile.toml"
      - "assets/**"
      - ".github/workflows/profile-cards.yml"

permissions:
  contents: write

concurrency:
  group: profile-cards
  cancel-in-progress: false   # queue back-to-back pushes instead of dropping one

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Pillow
        run: pip install pillow

      - name: Let GitHub register the new contributions
        if: github.event_name == 'workflow_dispatch'
        run: sleep 45

      - name: Render cards
        env:
          # PROFILE_TOKEN (classic PAT, scopes: repo + read:user) lets the cards count
          # private work; private repo names are replaced with CLASSIFIED codenames.
          # Falls back to the built-in token (public data only).
          GH_TOKEN: ${{ secrets.PROFILE_TOKEN || secrets.GITHUB_TOKEN }}
          GH_LOGIN: ${{ github.repository_owner }}
        run: python scripts/build.py

      - name: Commit if anything changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A ./*.svg README.md
          git diff --cached --quiet || (git commit -m "Refresh profile cards" && git pull --rebase && git push)
